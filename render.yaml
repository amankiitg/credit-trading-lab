# Render deployment blueprint -- sprint v8.6
#
# Three services in one project:
#   1. credit-lab-dashboard: always-on Streamlit web service (NO Alpaca keys)
#   2. credit-lab-signal:    evening cron, fires after US close
#   3. credit-lab-execution: morning cron, fires after approval window
#
# UTC cron schedules and DST:
#   Signal cron  "30 21 * * 1-5" = 17:30 EDT / 16:30 EST (both after 16:00 ET close)
#   Exec cron    "30 14 * * 1-5" = 10:30 EDT / 09:30 EST (both in clean execution window)
#   Render cron is UTC; the UTC schedule is DST-correct without runtime logic.
#
# Secret isolation:
#   Dashboard gets Supabase + Google OIDC secrets only. NO Alpaca keys.
#   Cron jobs get Supabase + Alpaca keys. NO Google OIDC secrets.
#
# All env var VALUES are set manually in the Render dashboard (sync: false).
# This file commits the KEY names only -- no credentials appear here.

services:
  - type: web
    name: credit-lab-dashboard
    runtime: python
    buildCommand: pip install -e . && python scripts/write_render_secrets.py
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    # Without this, every push to main redeploys the dashboard, including pushes
    # that only touch the cron jobs, the research notebooks or the sprint notes.
    # Each of those redeploys restarts the container and drops every open session
    # for no reason. With `paths` set, only a change to one of these triggers a
    # build. Everything else on the branch is ignored by this service.
    #
    # scripts/write_render_secrets.py is listed because the build command runs it,
    # so a change there does change what this service builds. render.yaml itself is
    # deliberately absent: editing it is already a Render-side change.
    buildFilter:
      paths:
        - dashboard/**
        - pyproject.toml
        - requirements.txt
        - scripts/write_render_secrets.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: STREAMLIT_AUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STREAMLIT_COOKIE_SECRET
        sync: false
      # ALPACA_PAPER_API_KEY and ALPACA_PAPER_SECRET_KEY are intentionally
      # absent from this service. The dashboard never calls Alpaca directly.

  - type: cron
    name: credit-lab-signal
    runtime: python
    buildCommand: pip install -e .
    schedule: "30 21 * * 1-5"
    startCommand: python scripts/run_signal.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_SECRET_KEY
        sync: false
      # No Google OIDC secrets here.

  - type: cron
    name: credit-lab-execution
    runtime: python
    buildCommand: pip install -e .
    schedule: "30 14 * * 1-5"
    startCommand: python scripts/run_execution.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_SECRET_KEY
        sync: false
      # No Google OIDC secrets here.
      # Position-drift email alert (execution/alerts.py), via the Resend
      # HTTP API -- not SMTP, since Render blocks outbound SMTP ports on
      # free-tier services but HTTPS (the API endpoint) is never blocked.
      # ALERT_EMAIL_TO falls back to ALLOWED_EMAIL if unset. RESEND_FROM
      # is optional -- defaults to Resend's shared onboarding@resend.dev
      # sender, which needs no domain verification.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: RESEND_FROM
        sync: false
