[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-trading-lab"
version = "0.0.1"
description = "Research lab for systematic credit trading strategies."
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.41",
    # Pinned, not floored: the cron jobs reach the paper account through this SDK.
    # Keep in step with requirements.txt and with
    # tests/test_alpaca_sdk_contract.py, which checks the code against the
    # installed release.
    "alpaca-py==0.45.0",
    "supabase>=2.0",
    "Authlib>=1.3.2,<1.4.0",
    "exchange-calendars>=4.2",
    "pandas",
    "numpy",
    "yfinance",
    "pyarrow",
    "matplotlib",
    "plotly",
    "scipy",
    "statsmodels",
]

[tool.setuptools]
packages = ["signals", "backtest", "execution", "risk", "models", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
